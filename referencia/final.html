<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--c9);background:var(--c0);line-height:1.5}
a{color:var(--azul7)}button{font-family:inherit;cursor:pointer}

header.gov{background:var(--azul9);color:#fff}

.brand{display:flex;align-items:center;gap:.7rem}
.brand-mark{background:var(--amarelo);color:var(--azul9);font-weight:800;border-radius:6px;padding:.3rem .55rem}
.brand h1{font-size:1rem;font-weight:600}.brand small{display:block;font-weight:400;opacity:.85;font-size:.7rem}

.proto-banner{background:var(--amarelo);color:var(--azul9);text-align:center;font-size:.74rem;font-weight:600;padding:.3rem .5rem}
main{max-width:1100px;margin:0 auto;padding:1rem 1rem 7rem}
.card{background:#fff;border:1px solid var(--c3);border-radius:var(--r);box-shadow:var(--sh);padding:1.1rem;margin-bottom:1rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;border-radius:6px;padding:.55rem 1.1rem;font-size:.92rem;font-weight:600;border:2px solid transparent;text-decoration:none}
.btn-primary{background:var(--azul7);color:#fff}.btn-primary:hover{background:var(--azul9)}
.btn-secondary{background:#fff;color:var(--azul7);border-color:var(--azul7)}
.btn-success{background:var(--verde7);color:#fff}

.b-espera{background:var(--azul0);color:var(--azul9);border-color:var(--azul1)}

.alert-success{background:var(--verde1);border-color:#bfe5bb;color:var(--verde7)}
.alert-proposta{background:var(--roxo1);border-color:#d9c9f7;color:var(--roxo7)}
.grid{display:grid;gap:1rem}

h2.page{font-size:1.35rem;margin:.2rem 0 .3rem;color:var(--azul9)}
.subtitle{color:var(--c5);font-size:.9rem;margin-bottom:1rem}
.kv{font-size:.8rem;color:var(--c5)}.kv strong{display:block;color:var(--c9);font-size:.98rem}
label{font-size:.85rem;font-weight:600;display:block;margin-bottom:.25rem}
input[type=text],input[type=tel],input[type=email],input[type=date],select{width:100%;padding:.6rem;border:1px solid var(--c3);border-radius:6px;font-size:.95rem;font-family:inherit;background:#fff}
.field{margin-bottom:.9rem}
.hint{font-size:.75rem;color:var(--c5);margin-top:.2rem}
.timeline{list-style:none;position:relative;padding-left:1.6rem}

.timeline li{position:relative;padding:0 0 1rem .4rem}

.timeline li.pending::before{background:#fff;border-color:var(--c3)}
.timeline li.hl::before{background:var(--verde7);border-color:var(--verde7)}
.tl-t{font-weight:600;font-size:.92rem}.tl-m{font-size:.76rem;color:var(--c5)}
.tl-o{display:inline-block;margin-left:.4rem;font-size:.66rem;background:var(--c1);border-radius:4px;padding:0 .35rem;color:var(--c7)}

.demo-panel button:not(:disabled):hover{background:var(--azul0)}
.pos-big{font-size:2.2rem;font-weight:800;color:var(--azul9);line-height:1}
.delta-up{color:var(--verde7);font-weight:700;font-size:.84rem}
.score-bar{background:var(--c1);border-radius:99px;height:10px;overflow:hidden;margin-top:.3rem}
.score-bar span{display:block;height:100%;background:var(--azul5)}
.banner-vaga{background:linear-gradient(120deg,var(--azul7),var(--azul9));color:#fff;border-radius:var(--r);padding:1.2rem;margin-bottom:1rem}
.kpi{background:#fff;border:1px solid var(--c3);border-radius:var(--r);padding:1rem;box-shadow:var(--sh)}
.kpi b{font-size:1.7rem;color:var(--azul9);display:block}.kpi span{font-size:.76rem;color:var(--c5)}
.sig{display:flex;justify-content:space-between;font-size:.84rem;padding:.32rem 0;border-bottom:1px dashed var(--c1)}
footer.proto{max-width:1100px;margin:2rem auto 0;padding:1rem;font-size:.72rem;color:var(--c5);border-top:1px solid var(--c3)}
/* gov.br login */
.gvb-wrap{max-width:420px;margin:2.2rem auto}
.gvb-card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.14);padding:1.6rem}
.gvb-logo{font-weight:800;font-size:1.6rem;color:var(--azul7)}

.gvb-alt{display:flex;align-items:center;gap:.6rem;border:1px solid var(--c3);border-radius:8px;padding:.6rem .8rem;margin-top:.5rem;font-size:.85rem;width:100%;background:#fff;text-align:left}
.gvb-alt:hover{background:var(--azul0)}
/* wizard */
.steps{display:flex;gap:.3rem;margin-bottom:1.1rem;flex-wrap:wrap}
.steps span{flex:1;min-width:90px;text-align:center;font-size:.68rem;font-weight:700;padding:.45rem .3rem;border-radius:6px;background:var(--c1);color:var(--c5)}
.steps span[aria-current="step"]{background:var(--azul7);color:#fff}
.steps span.done{background:var(--verde1);color:var(--verde7)}
.chip{display:inline-flex;align-items:center;gap:.35rem;background:var(--verde1);color:var(--verde7);border:1px solid #bfe5bb;border-radius:99px;padding:.15rem .6rem;font-size:.74rem;font-weight:700}
.upload-box{border:2px dashed var(--c3);border-radius:8px;padding:.7rem;text-align:center;font-size:.82rem;background:var(--c0)}
.crit{border:1px solid var(--c3);border-radius:8px;padding:.8rem;margin-bottom:.7rem;background:#fff}
.crit.on{border-color:var(--azul7);background:var(--azul0)}
.unit-row{border:1px solid var(--c3);border-radius:8px;padding:.8rem;margin-bottom:.6rem;background:#fff}
.wait{font-size:.78rem;font-weight:700;color:var(--azul9)}
details.man{border:1px solid var(--c3);border-radius:8px;padding:.7rem .9rem;margin-bottom:1rem;background:#fff}
details.man summary{font-weight:700;color:var(--azul9);cursor:pointer;font-size:.9rem}
.child-block{border-left:6px solid var(--azul7)}
@media print{.demo-fab,.demo-panel,header.gov,.proto-banner,.btn,footer.proto{display:none!important}}
</style>

<body>
<div id="app"></div>

<script>
/* ==========================================================================
   PROTÓTIPO — Portal do Candidato · Inscrição Creche SME-Rio · Time 6
   Hackathon SME-Rio + Rio Impact Lab 2026 — DADOS 100% FICTÍCIOS
   Integrações gov.br / CadÚnico / Bolsa Família: SIMULADAS como disponíveis
   ========================================================================== */

/* ---------- Regras parametrizadas (RN03/RN04/RN07) ---------- */
const RULES={
 processYear:2027,processName:"Inscrição Creche 2027",
 confirmationDeadlineHours:32,            // mock — regra temporal pendente SME
 presencialDeadlineDays:5,                // mock — comparecimento presencial pendente SME
 preferenceScore:{enabled:false,demoWeights:[10,8,6,4,2]},
 tieBreak:{status:"PENDENTE_SME",demo:["Maior pontuação em critérios prioritários","Antiguidade da inscrição","Sorteio auditável"]},
 statusLabels:{ATIVO:"Ativo",EM_ANALISE:"Documentação em análise",LISTA_ESPERA:"Lista de espera",SELECIONADO:"Selecionado",CONFIRMADO:"Confirmado",CANCELADO:"Cancelado",CANCELADO_CONFIRMACAO:"Cancelado na confirmação",CANCELADO_SISTEMA:"Cancelado pelo sistema"},
 /* Régua de vulnerabilidade parametrizada — valores ILUSTRATIVOS */
 vulnCriteria:[
  {id:"cad",label:"Família inscrita no CadÚnico",pts:30,api:"CadÚnico",doc:"Comprovação automática via API CadÚnico"},
  {id:"pbf",label:"Família beneficiária do Bolsa Família",pts:25,api:"Bolsa Família",doc:"Comprovação automática via API Bolsa Família"},
  {id:"renda",label:"Renda familiar per capita até ½ salário mínimo",pts:20,doc:"Comprovante de renda ou declaração"},
  {id:"pcd",label:"Criança com deficiência",pts:30,doc:"Laudo médico"},
  {id:"mono",label:"Família monoparental (responsável solo)",pts:20,doc:"Certidão de nascimento ou declaração"},
  {id:"prot",label:"Medida protetiva / acompanhamento Conselho Tutelar",pts:30,doc:"Documento do órgão competente"},
  {id:"acolh",label:"Criança em acolhimento institucional",pts:30,doc:"Termo de acolhimento"},
  {id:"irmao",label:"Irmão(ã) já matriculado(a) na unidade escolhida",pts:15,doc:"Declaração da unidade"}]
};
const waitByComp={Alta:"6+ meses",Média:"2 a 4 meses",Baixa:"até 2 meses"};
const badgeClass={LISTA_ESPERA:"b-espera",ATIVO:"b-espera",EM_ANALISE:"b-selecionado",SELECIONADO:"b-selecionado",CONFIRMADO:"b-confirmado",CANCELADO:"b-cancelado",CANCELADO_CONFIRMACAO:"b-cancelado",CANCELADO_SISTEMA:"b-cancelado"};
const REL=["Mãe","Pai","Avó/Avô","Tia/Tio","Prima/Primo","Madrinha/Padrinho","Vizinha/Vizinho","Amiga/Amigo","Outro"];

/* ---------- Catálogo de unidades (fictício) ---------- */
const CAT=[
 {id:"u1",unit:"EDI Machado de Assis",bairro:"Tijuca",cep:"20270",turnos:["Integral","Parcial"],comp:"Alta"},
 {id:"u2",unit:"Creche M. Clarice Lispector",bairro:"Vila Isabel",cep:"20551",turnos:["Integral"],comp:"Média"},
 {id:"u3",unit:"EDI Cecília Meireles",bairro:"Maracanã",cep:"20271",turnos:["Integral","Parcial"],comp:"Média"},
 {id:"u4",unit:"EDI Monteiro Lobato",bairro:"Andaraí",cep:"20510",turnos:["Integral"],comp:"Alta"},
 {id:"u5",unit:"Creche M. Tarsila do Amaral",bairro:"Grajaú",cep:"20561",turnos:["Integral","Parcial"],comp:"Baixa"},
 {id:"u6",unit:"EDI Villa-Lobos",bairro:"Tijuca",cep:"20270",turnos:["Integral"],comp:"Baixa"},
 {id:"u7",unit:"Creche M. Anísio Teixeira",bairro:"Rio Comprido",cep:"20261",turnos:["Integral","Parcial"],comp:"Média"},
 {id:"u8",unit:"EDI Chiquinha Gonzaga",bairro:"Praça da Bandeira",cep:"20260",turnos:["Integral"],comp:"Baixa"},
 {id:"u9",unit:"EDI Portinari",bairro:"Tijuca",cep:"20530",turnos:["Parcial"],comp:"Média"},
 {id:"u10",unit:"Creche M. Cora Coralina",bairro:"Vila Isabel",cep:"20551",turnos:["Integral"],comp:"Baixa"}];

function ev(ts,type,title,origin){return{ts,type,title,origin}}
function nowStr(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`}

/* ---------- Estado inicial ---------- */
function initialState(){return{
 loggedIn:false,loginStep:1,role:"family",demoStep:0,showDemo:false,modal:null,detailTab:"situacao",childTab:"fila",
 deadlineAt:null,presencialAt:null,confirmedOptionId:null,
 user:{name:"Ana Souza",cpf:"123.456.789-10"},
 wizard:null,
 children:[{
  id:"maria",name:"Maria Souza",cpfChild:"987.654.321-00",group:"Maternal I",turno:"Integral",fase:"acompanhamento",protocol:"2027-004412",
  docs:[{crit:"cad",name:"Verificação CadÚnico",status:"Validado",auto:true},
        {crit:"renda",name:"comprovante-renda.pdf",status:"Validado",auto:false},
        {crit:"mono",name:"certidao-maria.pdf",status:"Validado",auto:false}],
  options:[
   {id:1,pref:1,unit:"EDI Machado de Assis",bairro:"Tijuca",turno:"Integral",status:"LISTA_ESPERA",position:14,prev:16,comp:"Alta",queue:62,
    events:[ev("15/08/2026 09:12","INSCRICAO","Inscrição realizada","Portal"),ev("17/08/2026 14:05","AVALIACAO","Documentação validada (triagem IA + validação humana)","CRE 2ª"),ev("20/08/2026 08:00","CLASSIFICACAO","Classificação publicada — 16ª posição","Sistema"),ev("28/08/2026 10:41","POSICAO","Posição atualizada: 14ª (↑2 — cancelamentos na fila)","Sistema")]},
   {id:2,pref:2,unit:"Creche M. Clarice Lispector",bairro:"Vila Isabel",turno:"Integral",status:"LISTA_ESPERA",position:7,prev:9,comp:"Média",queue:34,
    events:[ev("15/08/2026 09:12","INSCRICAO","Inscrição realizada","Portal"),ev("20/08/2026 08:00","CLASSIFICACAO","Classificação publicada — 9ª posição","Sistema"),ev("26/08/2026 16:20","POSICAO","Posição atualizada: 7ª (↑2)","Sistema")]},
   {id:3,pref:3,unit:"EDI Cecília Meireles",bairro:"Maracanã",turno:"Parcial",status:"LISTA_ESPERA",position:5,prev:5,comp:"Média",queue:21,
    events:[ev("15/08/2026 09:12","INSCRICAO","Inscrição realizada","Portal"),ev("20/08/2026 08:00","CLASSIFICACAO","Classificação publicada — 5ª posição","Sistema")]},
   {id:4,pref:4,unit:"EDI Monteiro Lobato",bairro:"Andaraí",turno:"Integral",status:"LISTA_ESPERA",position:22,prev:22,comp:"Alta",queue:71,
    events:[ev("15/08/2026 09:12","INSCRICAO","Inscrição realizada","Portal"),ev("20/08/2026 08:00","CLASSIFICACAO","Classificação publicada — 22ª posição","Sistema")]},
   {id:5,pref:5,unit:"Creche M. Tarsila do Amaral",bairro:"Grajaú",turno:"Integral",status:"LISTA_ESPERA",position:11,prev:12,comp:"Baixa",queue:26,
    events:[ev("15/08/2026 09:12","INSCRICAO","Inscrição realizada","Portal"),ev("20/08/2026 08:00","CLASSIFICACAO","Classificação publicada — 12ª posição","Sistema"),ev("24/08/2026 11:02","POSICAO","Posição atualizada: 11ª (↑1)","Sistema")]}],
  score:[{l:"Critério A — Socioeconômico (régua 2027)",max:60,v:51},{l:"Critério B — Vulnerabilidade (validação humana quando exigida)",max:60,v:50},{l:"Critério C — Composição familiar",max:60,v:50}]
 }],
 inconsistencies:[
  {id:1,child:"M. S. — protocolo 2027-004412",flagged:false,desc:"Duas opções em 'Selecionado' simultaneamente.",states:[["Opção 1 — EDI Machado de Assis","Selecionado"],["Opção 3 — EDI Cecília Meireles","Selecionado"]],origin:"Convocações concorrentes em recálculos de filas distintas (28/08 10:41 e 10:43)."},
  {id:2,child:"J. P. R. — protocolo 2027-003877",flagged:false,desc:"'Confirmado' com opção remanescente ainda em 'Lista de espera'.",states:[["Opção 2 — Clarice Lispector","Confirmado"],["Opção 4 — Monteiro Lobato","Lista de espera"]],origin:"Falha no encerramento em cascata pós-confirmação (25/08 15:10)."},
  {id:3,child:"L. F. A. — protocolo 2027-002190",flagged:false,desc:"Cadastro sem CPF da criança (identificador oficial).",states:[["Identificação","CPF da criança ausente"]],origin:"Importação de cadastro legado (12/08)."}],
 audit:[]
}}

const KEY="creche-proto-v3";let S;
try{S=JSON.parse(localStorage.getItem(KEY))||initialState()}catch(e){S=initialState()}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function audit(type,desc,origin){S.audit.unshift({ts:nowStr(),type,desc,origin})}

/* ---------- Helpers UI ---------- */
const sl=c=>RULES.statusLabels[c]||c;
const badge=c=>`<span class="badge ${badgeClass[c]||"b-espera"}">${sl(c)}</span>`;
const conc=c=>`<span class="conc-${c}">Concorrência: ${c}</span>`;
const wait=c=>`<span class="wait">⏳ Espera estimada: ${waitByComp[c]}</span>`;
const maria=()=>S.children.find(c=>c.id==="maria");
const opt1=()=>maria().options.find(o=>o.id===1);
function tHtml(o,pend){let h='<ul class="timeline">';o.events.forEach(e=>{const hl=(e.type==="CONFIRMACAO"||e.type==="SELECAO")?" hl":"";h+=`<li class="${hl}"><div class="tl-t">${e.title}</div><div class="tl-m">${e.ts} · ${e.type}<span class="tl-o">origem: ${e.origin}</span></div></li>`});if(pend)h+=`<li class="pending"><div class="tl-t" style="color:var(--c5)">${pend}</div></li>`;return h+"</ul>"}
function esc(s){return String(s||"").replace(/[<>&"]/g,m=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[m]))}

/* ---------- Ações globais ---------- */
function goLogin2(){S.loginStep=2;save();render()}
function doLogin(){S.loggedIn=true;S.loginStep=1;audit("LOGIN","Autenticação gov.br (simulada) — conta "+S.user.cpf,"gov.br");save();location.hash="#/home"}
function logout(){S.loggedIn=false;save();location.hash="#/login"}
function setRole(r){S.role=r;save();location.hash=r==="cre"?"#/cre":"#/home"}
function setTab(t){S.detailTab=t;save();render()}
function setChildTab(t){S.childTab=t;save();render()}
function toggleDemo(){S.showDemo=!S.showDemo;save();render()}
function resetDemo(){if(confirm("Reiniciar toda a demonstração?")){S=initialState();S.loggedIn=true;save();location.hash="#/home";render()}}
function helpUnits(){S.modal="help";save();render()}

/* ---------- Modo Demo ---------- */
function demoAdvance(){const o=opt1(),t=nowStr();

 else if(S.demoStep===1){o.prev=o.position;o.position=3;o.events.push(ev(t,"POSICAO","Posição atualizada: 3ª (↑5 — encerramento de opções de outros cadastros)","Sistema · Classificação viva"));audit("POSICAO","Recalculo EDI Machado de Assis (Integral)","Sistema");S.demoStep=2}
 else if(S.demoStep===2){o.status="SELECIONADO";o.prev=o.position;o.position=null;

  o.events.push(ev(t,"SELECAO","Vaga disponibilizada — 'Selecionado'. Início do prazo de confirmação (regra temporal simulada — pendente SME)","Sistema"));
  o.events.push(ev(t,"NOTIFICACAO","Notificação enviada: portal + e-mail + WhatsApp (consentido)","Sistema · Notificações"));
  audit("SELECAO","Convocação gerada — protocolo 2027-004412","Sistema");S.demoStep=3;save();location.hash="#/convocacao";render();return}
 save();render()}
function confirmVaga(){const t=nowStr(),o=opt1();
 o.status="CONFIRMADO";S.confirmedOptionId=1;S.deadlineAt=null;
 S.presencialAt=Date.now()+RULES.presencialDeadlineDays*864e5;
 o.events.push(ev(t,"CONFIRMACAO","Vaga confirmada digitalmente pela responsável (assinatura gov.br)","Portal"));
 audit("CONFIRMACAO","Confirmação digital — EDI Machado de Assis (Integral)","Portal");
 maria().options.filter(x=>x.id!==1).forEach(x=>{x.status="CANCELADO_CONFIRMACAO";x.position=null;
  x.events.push(ev(t,"ENCERRAMENTO","Opção encerrada após confirmação de outra opção do mesmo cadastro (nomenclatura oficial a validar SME/ICH)","Sistema"));
  audit("ENCERRAMENTO",`Fila recalculada — ${x.unit} (${x.turno})`,"Sistema")});
 S.demoStep=4;S.modal=null;save();location.hash="#/comprovante";render()}

 const nc={id:"c"+Date.now(),name:w.child.name||"João Souza",cpfChild:w.child.cpf||"111.222.333-44",group:w.child.group,turno:w.opts[0]?w.opts[0].turno:"Integral",fase:"analise",protocol:"2027-00"+Math.floor(4000+Math.random()*999),

/* ---------- Countdown ---------- */
setInterval(()=>{document.querySelectorAll("[data-deadline]").forEach(el=>{
 const dl=Number(el.dataset.deadline);let ms=dl-Date.now();if(ms<0)ms=0;
 el.innerHTML=cdHtml(Math.floor(ms/864e5),Math.floor(ms%864e5/36e5),Math.floor(ms%36e5/6e4),Math.floor(ms%6e4/1e3))})},1000);
function cdHtml(d,h,m,s){const p=n=>String(n).padStart(2,"0");return `<div class="cd-box"><b>${p(d)}</b><span>dias</span></div><div class="cd-box"><b>${p(h)}</b><span>horas</span></div><div class="cd-box"><b>${p(m)}</b><span>min</span></div><div class="cd-box"><b>${p(s)}</b><span>seg</span></div>`}
function dStr(ts){const d=new Date(ts),p=n=>String(n).padStart(2,"0");return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} às ${p(d.getHours())}:${p(d.getMinutes())}`}

 if(w.step===3)body=`

  <details class="man"><summary>📘 Manual de assinatura e envio de documentos</summary>

  <button class="btn btn-ghost" onclick="wStep(3)">← Voltar</button> <button class="btn btn-primary" ${vulnOk()?"":"disabled"} onclick="wStep(5)">Continuar</button>`}
 if(w.step===5){const f=(w.filtro||"").toLowerCase();

   <div class="alert alert-proposta" style="margin-top:.8rem"><span>🧪</span><span><strong>Proposta em avaliação (SME):</strong> a ordem de preferência poderá somar pontos. Ordene pelo desejo real da família.</span></div></div></div>

 <h2 class="page">Inconsistências detectadas</h2>
 <p class="subtitle">Combinações fora da matriz de transições (RN10). <strong>Sem correção automática</strong> — regra não homologada; casos vão para análise humana.</p>
 ${S.inconsistencies.map(i=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap">
  <div><h3 style="color:var(--azul9)">${i.child}</h3><p style="font-size:.88rem;margin:.3rem 0">${i.desc}</p>
  ${i.states.map(([a,b])=>`<p class="kv">${a}: <strong style="display:inline">${b}</strong></p>`).join("")}</div>
  <div style="text-align:right">${i.flagged?`<span class="badge b-confirmado">Sinalizada para análise</span>`:`<span class="badge b-erro">Pendente</span>`}<br><br>
  <button class="btn btn-primary" onclick="S.modal={type:'inc',id:${i.id}};save();render()">Analisar</button></div></div></div>`).join("")}</main>`}
function vTerr(){const reg=(n,b,i,it,pa,ins)=>`<div class="card"><h4 style="color:var(--azul9)">${n}</h4>
 <div class="sig"><span>Buscas por creche (interesse no portal)</span><strong class="delta-up">↑ ${b}</strong></div>
 <div class="sig"><span>Inscrições (demanda manifesta)</span><strong>↑ ${i}</strong></div>
 <div class="sig"><span>Turno Integral</span><strong>${it}</strong></div>
 <div class="sig"><span>Turno Parcial</span><strong>${pa}</strong></div>
 <p class="kv" style="margin-top:.5rem">💡 ${ins}</p></div>`;
 return `<main><a class="btn btn-ghost" href="#/cre">← Painel CRE</a>
 <h2 class="page">Painel territorial de planejamento</h2>
 <p class="subtitle">Ocupação histórica + sinais do portal (buscas por CEP, favoritos, abandono). Dados agregados/anonimizados.</p>
 <div class="alert alert-warn"><span>⚠️</span><span><strong>Apoia a decisão — não decide.</strong> Abertura de unidades/turmas/turnos e orçamento são decisões da SME. Sinais de interesse não são previsão determinística.</span></div>
 <div class="grid g2">
 ${reg("Grande Tijuca","31%","12%","Demanda alta","Capacidade disponível","Possível descompasso entre preferência (Integral) e oferta (Parcial ociosa).")}
 ${reg("Vila Isabel / Grajaú","18%","9%","Demanda média","Equilíbrio","Interesse crescente ainda não convertido em inscrição — monitorar conversão.")}
 ${reg("Andaraí / Maracanã","24%","15%","Demanda muito alta","Demanda média","Fila histórica represada em Integral; avaliar sinais com fontes oficiais.")}
 ${reg("Rio Comprido / Pça Bandeira","9%","4%","Equilíbrio","Capacidade disponível","Abandono de cadastro acima da média — investigar barreiras de acesso.")}
 </div></main>`}
function vAud(){return `<main><a class="btn btn-ghost" href="#/cre">← Painel CRE</a>
 <h2 class="page">Trilha de auditoria</h2><p class="subtitle">Eventos da sessão (RN05) — timestamp, tipo, descrição e origem.</p>
 <div class="card">${S.audit.length?`<table><thead><tr><th>Quando</th><th>Tipo</th><th>Descrição</th><th>Origem</th></tr></thead><tbody>
 ${S.audit.map(a=>`<tr><td>${a.ts}</td><td>${a.type}</td><td>${a.desc}</td><td>${a.origin}</td></tr>`).join("")}</tbody></table>`:`<p class="kv">Nenhum evento ainda nesta sessão.</p>`}</div></main>`}

/* ---------- Modais ---------- */
function vModal(){const m=S.modal;if(!m)return"";
 if(m==="help")return mk(`<h3>Atendimento presencial próximo</h3>
  <p style="font-size:.88rem;margin-bottom:.6rem">Você pode fazer ou acompanhar a inscrição com apoio humano nestes pontos (fictícios):</p>
  <table><tbody>
  <tr><td><strong>CRE 2ª — Polo Tijuca</strong><br><span class="kv">Rua Conde de Bonfim, 100 · seg-sex 8h-17h</span></td></tr>
  <tr><td><strong>EDI Machado de Assis</strong><br><span class="kv">Rua das Acácias, 123 · seg-sex 8h-16h</span></td></tr>
  <tr><td><strong>Clínica da Família Vila Isabel</strong><br><span class="kv">Av. 28 de Setembro, 500 · seg-sex 9h-18h</span></td></tr></tbody></table>
  <p class="hint" style="margin-top:.6rem">Leve documento com foto. O atendimento presencial permanece disponível em todas as etapas.</p>`,
  `<button class="btn btn-primary" onclick="S.modal=null;save();render()">Fechar</button>`);
 if(m==="confirm")return mk(`<h3>Confirmar esta vaga?</h3>
  <p style="font-size:.9rem">Você está confirmando <strong>${opt1().unit} · ${opt1().turno}</strong> para <strong>${maria().name}</strong>.</p>
  <div class="alert alert-warn" style="margin-top:.8rem"><span>⚠️</span><span>Conforme as regras do processo (simuladas), a confirmação <strong>encerra suas demais opções</strong> e libera suas posições nessas filas. A vaga confirmada fica ocupada e não volta à fila.</span></div>`,
  `<button class="btn btn-secondary" onclick="S.modal=null;save();render()">Voltar</button>
   <button class="btn btn-success" onclick="confirmVaga()">Sim, confirmar</button>`);
 if(typeof m==="string"&&m.startsWith("wizOk:")){const p=m.split(":")[1];return mk(`<h3>✅ Inscrição enviada!</h3>
  <p style="font-size:.9rem">Protocolo <strong>${p}</strong>. Documentação recebida e assinada via gov.br (simulado). A triagem começou — acompanhe pelo bloco da criança nos momentos <strong>2 · Documentação</strong> e <strong>3 · Acompanhamento</strong>.</p>`,
  `<button class="btn btn-primary" onclick="S.modal=null;save();render()">Entendi</button>`)}
 if(m&&m.type==="inc"){const i=S.inconsistencies.find(x=>x.id===m.id);return mk(`<h3>Análise de inconsistência</h3>
  <p style="font-size:.9rem;margin-bottom:.5rem"><strong>${i.child}</strong></p><p style="font-size:.88rem">${i.desc}</p>
  <ul style="font-size:.85rem;margin:.6rem 0 .6rem 1.1rem">${i.states.map(([a,b])=>`<li>${a}: <strong>${b}</strong></li>`).join("")}</ul>
  <p class="kv"><strong style="display:inline">Evento de origem:</strong> ${i.origin}</p>
  <div class="alert alert-warn" style="margin-top:.8rem"><span>⚠️</span><span>Correção automática <strong>não homologada</strong>. Este caso deve ser sinalizado para análise humana da CRE (RN10).</span></div>`,
  `<button class="btn btn-secondary" onclick="S.modal=null;save();render()">Fechar</button>
   ${i.flagged?"":`<button class="btn btn-primary" onclick="flagInc(${i.id})">Sinalizar para análise</button>`}`)}
 return""}
function mk(body,actions){return `<div class="modal-bk" onclick="if(event.target===this){S.modal=null;save();render()}"><div class="modal" role="dialog" aria-modal="true">${body}<div class="modal-actions">${actions}</div></div></div>`}

/* ---------- Demo panel ---------- */
function vDemo(){if(!S.loggedIn)return"";
 const labels=["1️⃣ Fila Maria: 14ª → 8ª","2️⃣ Fila Maria: 8ª → 3ª","3️⃣ Simular seleção (convocação)"];
 const panel=S.showDemo?`<div class="demo-panel"><h4>🎬 Modo Demo (apresentação)</h4>
  ${labels.map((l,i)=>`<button ${S.demoStep===i?"":"disabled"} onclick="demoAdvance()">${l}${S.demoStep>i?" ✓":""}</button>`).join("")}
  <button ${S.demoStep===3?"":"disabled"} onclick="location.hash='#/convocacao';render()">4️⃣ Abrir convocação${S.demoStep>3?" ✓":""}</button>
  <button onclick="startWizard()">🧾 Iniciar nova inscrição (wizard)</button>
  <button onclick="resetDemo()">🔄 Reiniciar demonstração</button>
  <p class="demo-note">Controle apenas para demonstração — simula eventos que, no produto, viriam do sistema oficial. Classificação viva com trilha de auditoria.</p></div>`:"";
 return panel+`<button class="demo-fab" onclick="toggleDemo()" aria-expanded="${S.showDemo}">🎬 Modo Demo</button>`}

/* ---------- Shell ---------- */
function shell(content){
 const hdr=S.loggedIn?`<header class="gov"><div class="gov-top">
  <div class="brand"><span class="brand-mark">Rio</span><div><h1>Matrícula Digital · Creches<small>Prefeitura do Rio · SME — ${RULES.processName}</small></h1></div></div>
  <div style="display:flex;gap:.8rem;align-items:center;flex-wrap:wrap">
   <div class="role-switch" role="group" aria-label="Alternar perfil">
    <button aria-pressed="${S.role==="family"}" onclick="setRole('family')">Portal do Candidato</button>
    <button aria-pressed="${S.role==="cre"}" onclick="setRole('cre')">Painel CRE/SME</button></div>
   <button class="btn btn-ghost" style="color:#fff" onclick="logout()">Sair</button></div></div></header>`:"";
 return `${hdr}<div class="proto-banner">PROTÓTIPO — Hackathon SME-Rio + Rio Impact Lab 2026 · Time 6 · Dados fictícios · Integrações gov.br/CadÚnico/Bolsa Família simuladas · Regras marcadas como proposta dependem de validação SME</div>
 ${content}
 <footer class="proto">Acessibilidade: contraste AA, navegação por teclado, leitor de tela. Apoio presencial disponível — <button class="btn btn-ghost" onclick="helpUnits()">encontre a unidade mais próxima</button>. Hipóteses normativas (ex.: pontos por preferência, prazos) aparecem sempre rotuladas e não são regra vigente.</footer>
 ${vModal()}${vDemo()}`}

/* ---------- Router ---------- */
function render(){
 const h=location.hash||"#/login";
 if(!S.loggedIn&&h!=="#/login"){location.hash="#/login";return}
 let c;
 if(h==="#/login")c=vLogin();
 else if(h.startsWith("#/cre/inconsistencias"))c=vInc();
 else if(h.startsWith("#/cre/territorio"))c=vTerr();
 else if(h.startsWith("#/cre/auditoria"))c=vAud();
 else if(h.startsWith("#/cre"))c=vCre();
 else if(h.startsWith("#/inscricao"))c=vWizard();
 else if(h.startsWith("#/crianca/"))c=vChild(h.split("/")[2]);
 else if(h.startsWith("#/opcao/"))c=vDetail(Number(h.split("/")[2]));
 else if(h==="#/convocacao")c=vConv();
 else if(h==="#/comprovante")c=vComprovante();
 else c=vHome();
 document.getElementById("app").innerHTML=shell(c);
}
window.addEventListener("hashchange",render);
if(!location.hash)location.hash=S.loggedIn?"#/home":"#/login";
render();
</script>
</body>
</html>
